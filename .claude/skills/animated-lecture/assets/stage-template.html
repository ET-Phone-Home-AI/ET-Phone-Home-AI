<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--ARTIFACT-FRAGMENT-START-->
<meta name="claude:viewport-fit-sides" content="cover">
<title>Animated Lecture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a 16:9 slide. Title top-left with a progress marker, one or two soft-bordered animation boxes, and a quiet note card under each box. */
:root {
  --page: #EDF0F5; --bg: #FFFFFF; --ink: #16203A; --muted: #56617A; --line: #D5DBE6; --fwd: #2563EB; --tint: #F2F5FB;
  --display: 'Space Grotesk', 'Trebuchet MS', Arial, sans-serif;
  --text: 'Inter', Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
html, :fullscreen, ::backdrop { background: var(--page); }   /* full screen keeps the same framed-slide look */
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--text); }
[hidden] { display: none !important; }
.app { height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.slide { width: min(100vw - 32px, (100vh - 24px) * 16 / 9); aspect-ratio: 16 / 9; max-width: 100%; box-sizing: border-box; container-type: size;
  background: var(--bg); border: 1px solid #CDD4E0; border-radius: .7cqw; box-shadow: 0 .4cqw 2.4cqw rgba(22, 32, 58, .10);
  display: grid; grid-template-rows: auto 1fr; gap: 1.9cqw; padding: 2.7cqw 4.2cqw 2.6cqw; }
:fullscreen .slide { width: min(96vw, 93vh * 16 / 9); }   /* a little more surround in full screen so the frame stays visible on a 16:9 display */
.band { display: flex; align-items: flex-end; justify-content: space-between; gap: 3cqw; }
.step { margin: 0 0 .55cqw; font: 600 .95cqw var(--text); letter-spacing: .16em; text-transform: uppercase; color: var(--fwd); }
h1 { margin: 0; font: 600 2.9cqw/1.1 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.prog { display: flex; justify-content: flex-end; gap: .45cqw; padding-bottom: .9cqw; flex: 0 0 20cqw; width: 20cqw; }
.prog i { display: block; flex: 0 1 2.2cqw; min-width: .5cqw; height: .34cqw; border-radius: 1cqw; background: var(--line); }
.prog i.on { background: var(--fwd); }
.boxes { min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; }
.boxes.single { grid-template-columns: 1fr; }
.slide.cover { grid-template-rows: 1fr; }
.slide.cover .band, .slide.cover .info { display: none; }
.slide.cover .cw { border: 0; box-shadow: none; }
.box { min-width: 0; min-height: 0; display: grid; grid-template-rows: 1fr auto; gap: 1.2cqw;
  opacity: 0; transform: translateY(1cqw); transition: opacity .5s ease, transform .5s ease; }
.box.on { opacity: 1; transform: none; }
.cw { min-height: 0; position: relative; overflow: hidden; background: var(--bg); border: .13cqw solid var(--line); border-radius: 1.1cqw; box-shadow: 0 .3cqw 1.4cqw rgba(22, 32, 58, .06); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.info { height: 8.4cqw; box-sizing: border-box; overflow: hidden; background: var(--tint); border-radius: 1.1cqw; padding: 1cqw 1.5cqw;
  display: grid; grid-template-columns: auto 1fr auto; column-gap: 1.1cqw; align-items: center; }
.beats { display: flex; gap: .35cqw; align-self: end; padding-bottom: .1cqw; }
.beats i { display: block; width: .55cqw; height: .55cqw; border-radius: 50%; background: var(--line); }
.beats i.on { background: var(--fwd); }
.num { width: 2.5cqw; height: 2.5cqw; border-radius: 50%; background: var(--fwd); color: #fff; font: 700 1.25cqw/2.5cqw var(--display); text-align: center; }
.boxes.single .num { display: none; }
.txt { min-width: 0; display: flex; flex-direction: column; gap: .3cqw; }
h2 { margin: 0; font: 600 1.5cqw/1.2 var(--display); color: var(--ink); }
.cap { margin: 0; font: 400 1.15cqw/1.4 var(--text); color: var(--muted); min-height: 1.6cqw; }
footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
button { font: 600 15px var(--text); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--ink); }
button:disabled { opacity: .45; cursor: default; border-color: var(--line); }
button:focus-visible { outline: 3px solid var(--fwd); outline-offset: 2px; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.note { margin: 0; flex: 1; min-width: 240px; font: 400 13px/1.4 var(--text); color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .box { transition: none; } }
</style>

<div class="app">
  <div class="slide" id="slide">
    <header class="band">
      <div><p class="step" id="step"></p><h1 id="title"></h1></div>
      <div class="prog" id="prog" aria-hidden="true"></div>
    </header>
    <div class="boxes" id="boxes">
      <section class="box" id="box0"><div class="cw"><canvas id="cv0" role="img" aria-label="First animation of this slide"></canvas></div><div class="info"><span class="num" aria-hidden="true">1</span><div class="txt"><h2 id="h0"></h2><p class="cap" id="cap0" aria-live="polite"></p></div><div class="beats" id="bt0" aria-hidden="true"></div></div></section>
      <section class="box" id="box1"><div class="cw"><canvas id="cv1" role="img" aria-label="Second animation of this slide"></canvas></div><div class="info"><span class="num" aria-hidden="true">2</span><div class="txt"><h2 id="h1"></h2><p class="cap" id="cap1" aria-live="polite"></p></div><div class="beats" id="bt1" aria-hidden="true"></div></div></section>
    </div>
  </div>
  <footer id="foot" hidden>
    <div class="ctl">
      <button id="prev" type="button">← Back</button>
      <button id="replay" type="button">Replay</button>
      <button id="next" type="button" class="primary">Next →</button>
      <button id="full" type="button">Full screen</button>
    </div>
    <p class="note" id="note">H hides these controls, F toggles full screen, R replays the slide. → or a click shows the next box, then the next slide. Each press of → plays one step. ← replays the current step; pressed again straight away it goes back one step.</p>
  </footer>
</div>

<script>
(() => {
/* =====================================================================
   ENGINE: do not edit below until the SCENES marker.
   ===================================================================== */
const C = { bg:'#FFFFFF', ink:'#16203A', mut:'#5B6578', line:'#D5DBE6', pale:'#EEF1F6', blue:'#2563EB', org:'#EA580C', grn:'#15803D', red:'#DC2626', pur:'#7C3AED' };
const MONO = "'JetBrains Mono','Courier New',monospace", DISP = "'Space Grotesk','Trebuchet MS',Arial,sans-serif";
const H = 900; let W = 1100;                 /* logical drawing size of the box being painted: 1100 x 900 (two boxes) or 1900 x 900 (one box) */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,u) => a + (b-a)*u;
const seg = (t,a,b) => clamp((t-a)/(b-a), 0, 1);                         /* 0..1 progress of time t between seconds a and b */
const ease = u => u < .5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2)/2;
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }  /* seeded random: const r = mulberry(7); r() */
const randn = r => Math.sqrt(-2*Math.log(r()+1e-9)) * Math.cos(6.283185*r());
let g = null;                                 /* 2D context of the box being painted */
function txt(s, x, y, size, col, al, wt, fam){ g.font = `${wt||500} ${size}px ${fam||MONO}`; g.textAlign = al||'left'; g.textBaseline = 'alphabetic'; g.fillStyle = col||C.ink; g.fillText(s, x, y); }
function A(a, fn){ if (a <= 0) return; const o = g.globalAlpha; g.globalAlpha = o*clamp(a,0,1); fn(); g.globalAlpha = o; }   /* draw fn at opacity a */
function circle(x, y, r, fill, stroke, lw){ g.beginPath(); g.arc(x, y, r, 0, 6.2832); if (fill){ g.fillStyle = fill; g.fill(); } if (stroke){ g.strokeStyle = stroke; g.lineWidth = lw||1.5; g.stroke(); } }
function line(x1, y1, x2, y2, col, lw){ g.strokeStyle = col||C.line; g.lineWidth = lw||2; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
function rect(x, y, w, h, fill, stroke, lw, rad){ g.beginPath(); if (rad && g.roundRect) g.roundRect(x, y, w, h, rad); else g.rect(x, y, w, h); if (fill){ g.fillStyle = fill; g.fill(); } if (stroke){ g.strokeStyle = stroke; g.lineWidth = lw||1.5; g.stroke(); } }
function arrow(x1, y1, x2, y2, col, lw){ const a = Math.atan2(y2-y1, x2-x1), h = 14 + (lw||3)*2; line(x1, y1, x2, y2, col, lw||3); g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - h*Math.cos(a-.45), y2 - h*Math.sin(a-.45)); g.moveTo(x2, y2); g.lineTo(x2 - h*Math.cos(a+.45), y2 - h*Math.sin(a+.45)); g.stroke(); }
function travel(x1, y1, x2, y2, u, col, r, lw){ if (u <= 0) return; const e = ease(u), x = lerp(x1,x2,e), y = lerp(y1,y2,e); line(x1, y1, x, y, col, lw||3); if (u < 1) circle(x, y, r||6, col); }   /* a signal moving along a wire, u = 0..1 */
function flash(x, y, r, u, col){ if (u > 0 && u < 1) A(1-u, () => circle(x, y, r + 20*u, null, col, 3)); }                    /* expanding ring when something fires */

function coverScene(o){                      /* title page: SLIDES.push({ cover:true, title:'', boxes:[coverScene({ label, title:[line1, line2], subtitle, author, affil })] }) */
  const Ls = [3, 4, 2], Xs = [1360, 1585, 1810], Yn = (l, i) => 450 + (i - (Ls[l]-1)/2)*150;
  return { title:'', D:3, caps:[], enter(){},
    draw(t){ const u = i => ease(seg(t, .15 + i*.18, .9 + i*.18)); let y = 250;
      A(u(0), () => txt(o.label || '', 120, y, 28, C.blue, 'left', 700, DISP)); y += 130;
      const sz = o.size || 118; (o.title || []).forEach((ln, i) => { A(u(1 + i), () => txt(ln, 116, y - (1 - u(1 + i))*20, sz, C.ink, 'left', 700, DISP)); y += sz*1.085; });   /* size: smaller title type for long titles */
      A(u(3), () => txt(o.subtitle || '', 120, y - 40, 40, C.mut, 'left', 500, DISP));
      A(u(4), () => { txt(o.author || '', 120, 760, 44, C.ink, 'left', 700, DISP); txt(o.affil || '', 120, 812, 32, C.mut, 'left', 500, DISP); });
      if (o.art){ A(u(2), () => o.art(t)); return; }           /* art: your own cover graphic, drawn in the area x 1240 to 1860 */
      const ph = t % 5, fw = [seg(ph, .3, 1.1), seg(ph, 1.1, 1.9)], bk = [seg(ph, 3.4, 4.2), seg(ph, 2.6, 3.4)];
      const fa = [ph < 1.1 ? 1 : 1 - seg(ph, 1.1, 1.5), seg(ph, 1, 1.2)*(1 - seg(ph, 1.9, 2.3)), seg(ph, 1.8, 2)*(1 - seg(ph, 2.6, 3))], ba = [seg(ph, 4.1, 4.3)*(1 - seg(ph, 4.5, 5)), seg(ph, 3.3, 3.5)*(1 - seg(ph, 3.8, 4.2)), seg(ph, 2.5, 2.7)*(1 - seg(ph, 3, 3.4))];
      A(u(2), () => { for (let l = 0; l < 2; l++) for (let i = 0; i < Ls[l]; i++) for (let j = 0; j < Ls[l+1]; j++){ const x1 = Xs[l], y1 = Yn(l, i), x2 = Xs[l+1], y2 = Yn(l+1, j); line(x1, y1, x2, y2, C.line, 2);
          if (fw[l] > 0 && fw[l] < 1 && (i + j) % 2 === 0) circle(lerp(x1, x2, ease(fw[l])), lerp(y1, y2, ease(fw[l])), 7, C.blue);
          if (bk[l] > 0 && bk[l] < 1 && (i + j) % 2 === 1) circle(lerp(x2, x1, ease(bk[l])), lerp(y2, y1, ease(bk[l])), 7, C.org); }
        for (let l = 0; l < 3; l++) for (let i = 0; i < Ls[l]; i++){ const x = Xs[l], yy = Yn(l, i); circle(x, yy, 34, C.bg, C.ink, 2.5); A(fa[l]*.9, () => circle(x, yy, 34, C.blue, C.ink, 2.5)); A(ba[l], () => circle(x, yy, 44, null, C.org, 4)); } });
    } };
}

const AUTO_CHAIN = false;                     /* false: the next box waits for Next (Erdem's preference). true: it starts by itself when the previous one finishes. */
const STEP_MODE = true;                      /* true: each box advances one step per Next press. false: a box plays straight through. */
const BACK_REPLAY = 1.5;                     /* Back within this many seconds of a box starting steps to the previous box; later than that it replays the current box */
const CHAIN_GAP = 0.8;                        /* seconds between one box finishing and the next starting */
const SLIDES = [];                            /* filled in the SCENES section */
const DECK = { label: '' };                   /* optional course or talk label shown before "Slide 1 of N" */

/* =====================================================================
   SCENES START: replace everything between the two SCENES markers.
   A scene is { title, D, caps, enter(), draw(t) }. See SKILL.md.
   ===================================================================== */

const barsScene = { title:'Numbers that count up', D:5,
  caps:[[0, 'Each box is one small animation with its own running caption.'], [2.5, 'Values are computed in code, so what is on screen is always correct.']],
  enter(){ const r = mulberry(3); this.v = [0,1,2,3,4].map(() => 20 + Math.round(r()*80)); this.sum = this.v.reduce((a,b) => a+b, 0); },
  draw(t){
    this.v.forEach((v, i) => { const u = ease(seg(t, .3 + i*.35, 1.5 + i*.35)), x = 170 + i*170;
      rect(x, 640 - 4.6*v*u, 110, 4.6*v*u, C.blue, null, 0, 8); txt(String(Math.round(v*u)), x+55, 630 - 4.6*v*u, 34, C.ink, 'center', 700); });
    line(120, 640, 980, 640, C.line, 3);
    A(seg(t, 3, 3.6), () => txt('sum = ' + Math.round(this.sum*ease(seg(t, 3, 4.4))), W/2, 780, 64, C.org, 'center', 700));
  } };

const signalScene = { title:'A signal travels and something fires', D:5,
  caps:[[0, 'The second box appears only when the first has finished.'], [2.6, 'Use colour consistently: here blue means a signal moving forward.']],
  enter(){},
  draw(t){
    const P = [[200, 450], [550, 250], [550, 650], [900, 450]];
    [[0,1],[0,2],[1,3],[2,3]].forEach(([a,b]) => line(P[a][0], P[a][1], P[b][0], P[b][1], C.line, 3));
    travel(P[0][0], P[0][1], P[1][0], P[1][1], seg(t, .5, 1.6), C.blue); travel(P[0][0], P[0][1], P[2][0], P[2][1], seg(t, .5, 1.6), C.blue);
    travel(P[1][0], P[1][1], P[3][0], P[3][1], seg(t, 2, 3.1), C.blue); travel(P[2][0], P[2][1], P[3][0], P[3][1], seg(t, 2, 3.1), C.blue);
    P.forEach((p, i) => { const on = seg(t, [0, 1.6, 1.6, 3.1][i], [.4, 2, 2, 3.5][i]);
      circle(p[0], p[1], 46, C.bg, C.ink, 2); A(on, () => circle(p[0], p[1], 46, C.blue)); flash(p[0], p[1], 46, on, C.blue);
      txt('ABCD'[i], p[0], p[1]+13, 38, on > .5 ? C.bg : C.ink, 'center', 700, DISP); });
    A(seg(t, 3.6, 4.2), () => txt('D fired', W/2, 800, 48, C.grn, 'center', 700, DISP));
  } };

DECK.label = 'Demo';
SLIDES.push({ cover:true, title:'', boxes:[coverScene({ label:'COURSE OR EVENT', title:['Title of the', 'Presentation'], subtitle:'One line that says what the audience will learn', author:'Prof. Erdem Topsakal', affil:'College of Engineering, VCU' })] });
SLIDES.push({ title:'How this kind of slide works', boxes:[barsScene, signalScene] });
SLIDES.push({ title:'A slide can also hold one wide box', boxes:[{ title:'One box uses the full width (W = 1900)', D:3, caps:[[0, 'Draw relative to W so the picture stays centred.']], enter(){},
  draw(t){ const u = ease(seg(t, .3, 2.4)); line(200, 450, W-200, 450, C.line, 4); circle(lerp(200, W-200, u), 450, 30, C.org); txt(Math.round(u*100) + '%', W/2, 620, 80, C.org, 'center', 700); } }] });

/* =====================================================================
   SCENES END. PLAYER: do not edit below.
   ===================================================================== */
const $ = id => document.getElementById(id), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const panels = [0, 1].map(i => { const cv = $('cv'+i), P = { cv, ctx:cv.getContext('2d'), box:$('box'+i), cap:$('cap'+i), head:$('h'+i), bt:$('bt'+i), btKey:'', shown:'', w:1, h:1, dpr:1 };
  const rs = () => { P.dpr = Math.min(window.devicePixelRatio || 1, 2); P.w = cv.clientWidth || 1; P.h = cv.clientHeight || 1; cv.width = Math.round(P.w*P.dpr); cv.height = Math.round(P.h*P.dpr); };
  new ResizeObserver(rs).observe(cv.parentElement); rs(); return P; });
let sl = 0, started = 0, tt = [], stops = [], beats = [], lastNow = 0;
/* Steps inside a box: by default one step per caption. A scene may list its own pause times instead: steps:[2.5, 4.2]. */
const pausesOf = s => !STEP_MODE ? [] : (s.steps ? s.steps.slice() : (s.caps || []).map(c => c[0] - .02).filter(v => v > .05 && v < s.D));
const beatStart = (s, b) => b === 0 ? 0 : pausesOf(s)[b-1] + (s.steps ? 0 : .02);
function setBeat(k, b, fromStart){ const s = SLIDES[sl].boxes[k], P = pausesOf(s); beats[k] = b; stops[k] = b < P.length ? P[b] : Infinity; if (fromStart){ tt[k] = beatStart(s, b); if (s.enter) s.enter(); } }
function finishBox(k){ const s = SLIDES[sl].boxes[k]; beats[k] = pausesOf(s).length; stops[k] = Infinity; tt[k] = Math.max(tt[k] || 0, s.D + 5); }
function paint(P, scene, t){
  let cap = ''; for (const c of (scene.caps || [])) if (t >= c[0]) cap = c[1];
  if (cap !== P.shown){ P.shown = cap; P.cap.textContent = cap; }
  g = P.ctx; g.setTransform(1,0,0,1,0,0); g.globalAlpha = 1; g.fillStyle = C.bg; g.fillRect(0, 0, P.cv.width, P.cv.height);
  const s = Math.min(P.w/W, P.h/H); g.setTransform(P.dpr*s, 0, 0, P.dpr*s, P.dpr*(P.w - W*s)/2, P.dpr*(P.h - H*s)/2);
  scene.draw(t);
}
function startBox(){ const d = SLIDES[sl]; if (started >= d.boxes.length) return false; const k = started; panels[k].box.classList.add('on'); started++; setBeat(k, 0, true); return true; }
function go(i, toEnd){ sl = clamp(i, 0, SLIDES.length-1); const d = SLIDES[sl]; started = 0; tt = []; stops = []; beats = []; W = d.boxes.length === 1 ? 1900 : 1100;
  $('boxes').classList.toggle('single', d.boxes.length === 1); $('slide').classList.toggle('cover', !!d.cover);
  panels.forEach((P, k) => { P.shown = ''; P.cap.textContent = ''; P.btKey = ''; P.bt.innerHTML = ''; P.box.classList.remove('on'); P.box.hidden = k >= d.boxes.length; P.head.textContent = d.boxes[k] ? (d.boxes[k].title || '') : ''; });
  void panels[0].box.offsetWidth; startBox();
  if (reduce){ while (startBox()); for (let k = 0; k < started; k++) finishBox(k); }
  else if (toEnd){ while (startBox()); for (let k = 0; k < started - 1; k++) finishBox(k); setBeat(started - 1, pausesOf(d.boxes[started-1]).length, true); }
  $('step').textContent = (DECK.label ? DECK.label + ' · ' : '') + 'Slide ' + (sl+1) + ' of ' + SLIDES.length; $('title').textContent = d.title; $('prev').disabled = false;
  $('prog').innerHTML = SLIDES.map((_, k) => k === sl ? '<i class="on"></i>' : '<i></i>').join(''); }
function next(){ if (reduce){ if (sl < SLIDES.length-1) go(sl+1); return; }           /* one step forward: next step in this box, then the next box, then the next slide */
  const k = started - 1, s = SLIDES[sl].boxes[k], P = pausesOf(s);
  if (beats[k] < P.length){ tt[k] = Math.max(tt[k], P[beats[k]]); setBeat(k, beats[k] + 1, false); return; }
  tt[k] = Math.max(tt[k], s.D);
  if (!startBox() && sl < SLIDES.length-1) go(sl+1); }
function back(){ if (reduce){ go(sl-1); return; }                                       /* one step backward, the mirror of next() */
  const k = started - 1, s = SLIDES[sl].boxes[k], b = beats[k];
  if (tt[k] - beatStart(s, b) > BACK_REPLAY){ setBeat(k, b, true); return; }           /* replay the step that is showing */
  if (b > 0){ setBeat(k, b - 1, true); return; }                                        /* the step before it in this box */
  if (k > 0){ panels[k].box.classList.remove('on'); started--; setBeat(k - 1, pausesOf(SLIDES[sl].boxes[k-1]).length, true); return; }   /* hide this box, replay the last step of the one before */
  if (sl > 0) go(sl-1, true); else setBeat(0, 0, true); }                               /* previous slide, shown complete */
function frame(now){
  const d = SLIDES[sl], dt = Math.min(.1, Math.max(0, (now - lastNow)/1000)); lastNow = now;
  if (AUTO_CHAIN && started < d.boxes.length && stops[started-1] === Infinity && tt[started-1] > d.boxes[started-1].D + CHAIN_GAP) startBox();
  for (let k = 0; k < started; k++){ const s = d.boxes[k], P = panels[k], n = pausesOf(s).length + 1; tt[k] = Math.min(tt[k] + dt, stops[k]); paint(P, s, reduce ? s.D + .01 : tt[k]);
